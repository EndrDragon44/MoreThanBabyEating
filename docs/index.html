<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More than Baby Eating Mod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Permanent+Marker&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            background-attachment: fixed;
            width: calc(100% + 0vw);
            overflow-x: hidden;
        }
        .marker-font {
            font-family: 'Permanent Marker', cursive;
        }
        .vt-font {
            font-family: 'VT323', monospace;
        }

        .broken-calc-box {
            border: calc(4px + 2vw) dashed #ff0055;
            border-radius: calc(50px - 100px); 
            padding: calc(2rem - 0.5vw);
            margin-left: calc(-2vw + 1rem);
            width: calc(100% + 4vw);
            transform: rotate(calc(sin(0) * 2deg) skewX(calc(1deg * 2)));
            box-shadow: calc(10px + 1vw) calc(10px + 1vw) 0px #111;
            background: rgba(255, 255, 255, 0.92);
            transition: transform 0.3s ease;
        }
        .broken-calc-box:hover {
            transform: rotate(calc(1deg * 3)) scale(calc(1 - 0.02));
            box-shadow: calc(15px + 2vw) calc(15px + 2vw) 0px #00ffff;
        }

        .wobbly-button {
            border: 4px solid #111;
            border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
            box-shadow: calc(3px + 0.2vw) calc(3px + 0.2vw) 0px #111;
            transition: all 0.1s ease;
        }
        .wobbly-button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #111;
        }

        .buggy-heading {
            font-size: calc(1.5rem + 1.5vw);
            letter-spacing: calc(2px - 0.5vw);
        }

        .fucked-grid {
            display: grid;
            grid-template-columns: calc(50% + 50px) calc(50% - 50px);
            gap: calc(2rem - 4vw);
        }
        @media (max-width: 768px) {
            .fucked-grid {
                grid-template-columns: 1fr;
            }
        }

        .squiggle-line {
            height: calc(8px + 0.5vh);
            background: repeating-linear-gradient(45deg, #111, #111 calc(10px + 2vw), transparent calc(10px + 2vw), transparent calc(20px + 4vw));
            opacity: 0.85;
            border-radius: 999px;
            width: calc(100% - 2vw);
        }
    </style>
</head>

        </div>
